    </div>

  </header>
  <main>
    <div class="contact-form">
      <h2>Contáctanos</h2>
      <form action="/contacto" method="POST">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre y Apellido</label>
          <input type="text" class="form-control" id="nombre" name="nombre" required />
        </div>
        <div class="mb-3">
          <label for="telefono" class="form-label">telefono</label>
          <input type="number" class="form-control" id="telefono" name="telefono" required />
        </div>
         <div class="mb-3">
        <label for="servicio" class="form-label">Tipo de Consulta</label>
        <select class="form-select" id="servicio">
          <option selected disabled>Selecciona una opción</option>
          <option value="residencial">Consulta</option>
          <option value="comercial">Asesoria Especializada</option>
        </select>
      </div>
       <div class="mb-3">
        <label for="servicio" class="form-label">Tipo de Industria</label>
        <select class="form-select" id="servicio">
          <option selected disabled>Selecciona una opción</option>
          <option value="residencial">Avicola</option>
          <option value="comercial">Minera</option>
          <option value="industrial">Pesquera</option>
          <option value="asesoria">AgroIndustria</option>
          <option value="asesoria">Industria Alimentaria</option>
          <option value="asesoria">Industria Textil</option>
          <option value="asesoria">Otros</option>
        </select>
      </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" name="email" required />
        </div>
        <div class="mb-3">
          <label for="mensaje" class="form-label">Mensaje</label>
          <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
      </form>
    </div>
  </main>
  <div class="fixed-wsp">
    <a href="https://wa.me/51999541653?text=Hola,%20quiero%20realizar%20un%20pedido" class="wsp-button" target="_blank" aria-label="WhatsApp">
